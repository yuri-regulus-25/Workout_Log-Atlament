<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="vesria-title vesria-desc"
     color="#8FDFFF"
     style="--vesria-color: currentColor; --vesria-accent: currentColor;">
  <title id="vesria-title">Vesria constellation symbol</title>
  <desc id="vesria-desc">An asymmetric constellation of related nodes, orbital arcs, and independent particles.</desc>

  <!--
    Color interface uses the vesria-color custom property for structure,
    and vesria-accent for selected nodes and the glint.
    Both default to currentColor. All opacity remains local to each hierarchy.
  -->

  <g id="symbol" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="orbit-primary"
       stroke="var(--vesria-color, currentColor)"
       stroke-width="5.5">
      <path id="orbit-sweep"
            d="M105 145
               C154 61 286 40 386 103
               C464 153 473 278 421 361"
            opacity="0.90"/>
      <path id="orbit-flow"
            d="M83 314 C139 382 211 388 266 302 C321 216 370 194 433 230"
            stroke-width="4.5"
            opacity="0.78"/>
    </g>

    <g id="orbit-secondary"
       stroke="var(--vesria-color, currentColor)"
       stroke-width="2.5"
       opacity="0.50">
      <path d="M83 240 C69 316 112 391 184 421"/>
      <path d="M151 112 C233 75 337 94 404 161"/>
      <path d="M421 361 C373 424 282 457 205 423"/>
      <path d="M404 161 C434 198 446 242 439 282" stroke-dasharray="1 13"/>
      <path d="M211 428 C266 448 330 439 377 407" stroke-dasharray="2 12"/>
    </g>

    <g id="edges-primary"
       stroke="var(--vesria-color, currentColor)"
       stroke-width="3.5"
       opacity="0.78">
      <path d="M140 278 L238 194 L340 230"/>
      <path d="M238 194 L273 342 L390 347"/>
      <path d="M140 278 Q204 323 273 342"/>
    </g>

    <g id="edges-secondary"
       stroke="var(--vesria-color, currentColor)"
       stroke-width="2"
       opacity="0.50">
      <path d="M109 145 L140 278"/>
      <path d="M238 194 L285 124"/>
      <path d="M340 230 L392 164" stroke-dasharray="2 9"/>
      <path d="M273 342 L218 400"/>
      <path d="M390 347 L421 361" opacity="0.72"/>
      <path d="M184 421 L273 342" stroke-dasharray="3 10"/>
    </g>

    <g id="nodes-primary"
       fill="var(--vesria-accent, currentColor)"
       stroke="var(--vesria-accent, currentColor)">
      <circle id="node-origin" cx="140" cy="278" r="17" stroke-width="5" fill-opacity="0.22"/>
      <circle id="node-focus" cx="273" cy="342" r="24" stroke-width="6" fill-opacity="0.32"/>
      <circle id="node-terminal" cx="390" cy="347" r="13" stroke-width="4" fill-opacity="0.80"/>
    </g>

    <g id="nodes-secondary"
       fill="var(--vesria-color, currentColor)"
       stroke="var(--vesria-color, currentColor)">
      <circle cx="238" cy="194" r="10" stroke-width="4" fill-opacity="0.28"/>
      <circle cx="340" cy="230" r="8" stroke-width="3" fill-opacity="0.82"/>
      <circle cx="109" cy="145" r="7" stroke-width="3" fill-opacity="0.70"/>
      <circle cx="285" cy="124" r="5" stroke-width="3" fill-opacity="0.86"/>
      <circle cx="392" cy="164" r="5" stroke-width="2.5" fill-opacity="0.75"/>
      <circle cx="218" cy="400" r="5" stroke-width="2.5" fill-opacity="0.65"/>
      <circle cx="421" cy="361" r="6" stroke-width="3" fill-opacity="0.80"/>
    </g>

    <g id="orbit-nodes"
       fill="var(--vesria-color, currentColor)"
       stroke="none">
      <circle cx="105" cy="145" r="5"/>
      <circle cx="386" cy="103" r="6"/>
      <circle cx="439" cy="282" r="4" opacity="0.72"/>
      <circle cx="205" cy="423" r="5" opacity="0.85"/>
    </g>

    <g id="particles"
       fill="var(--vesria-color, currentColor)"
       stroke="none">
      <circle cx="76" cy="205" r="3.5" opacity="0.68"/>
      <circle cx="83" cy="350" r="5" opacity="0.90"/>
      <circle cx="116" cy="404" r="2.5" opacity="0.50"/>
      <circle cx="167" cy="88" r="3" opacity="0.58"/>
      <circle cx="229" cy="78" r="2" opacity="0.44"/>
      <circle cx="323" cy="72" r="3.5" opacity="0.70"/>
      <circle cx="433" cy="132" r="3" opacity="0.55"/>
      <circle cx="459" cy="213" r="5" opacity="0.86"/>
      <circle cx="455" cy="326" r="2.5" opacity="0.52"/>
      <circle cx="352" cy="413" r="3" opacity="0.62"/>
      <circle cx="311" cy="457" r="2" opacity="0.40"/>
      <circle cx="157" cy="346" r="2" opacity="0.58"/>
      <circle cx="301" cy="260" r="2.5" opacity="0.56"/>
    </g>

    <g id="flare"
       fill="var(--vesria-accent, currentColor)"
       stroke="none">
      <path d="M352 118 C353 130 359 136 371 137 C359 138 353 144 352 156 C351 144 345 138 333 137 C345 136 351 130 352 118Z"
            opacity="0.94"/>
      <circle cx="352" cy="137" r="3"/>
    </g>
  </g>
</svg>
