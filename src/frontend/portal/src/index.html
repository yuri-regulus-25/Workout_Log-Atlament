<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal — Atlament</title>
    <link rel="icon" type="image/svg+xml" href="./frontend-common/branding/assets/logo_svg_primary.svg" />
    <link rel="stylesheet" href="./mdi/css/materialdesignicons.min.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./frontend-common/easter-egg/styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="portal">
      <div class="portal-container">
        <header class="portal-hero">
          <div class="portal-brand" aria-label="Atlament Portal">
            <button id="portal-logo-trigger" class="portal-logo-trigger" type="button" aria-label="Toggle Atlament logo variant">
              <span class="portal-logo-box">
                <img id="portal-logo" class="portal-logo" src="./frontend-common/branding/assets/logo_svg_primary.svg" alt="" />
              </span>
            </button>
            <span id="portal-character-trigger" class="portal-brand-name portal-title-trigger">Portal - なんかせつめいいれてみる</span>
          </div>
          <div class="portal-heading">
            <p class="portal-eyebrow">Browse, Explore, Analyze.</p>
            <h1>What do you want to explore?</h1>
            <p class="portal-description">ワークアウトの履歴、種目ごとの記録、蓄積したデータの分析へ。</p>
          </div>
          <section id="sync-notice" class="sync-status" aria-live="polite">
            <span class="sync-loader" aria-hidden="true"></span>
            <i id="sync-notice-icon" class="sync-icon mdi" aria-hidden="true"></i>
            <span id="sync-notice-text">GitHubからデータを取得しています。</span>
          </section>
        </header>
        <section class="launcher" aria-label="Applications">
          <div class="launcher-header">
            <div>
              <span class="launcher-eyebrow">APPLICATIONS</span>
              <h2>アプリケーション</h2>
            </div>
            <span id="launcher-count" class="launcher-count"></span>
          </div>
          <div id="portal-app-grid" class="application-grid"></div>
        </section>
      </div>
    </main>
  </body>
</html>
